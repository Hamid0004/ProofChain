[package]
name = "proofchain"
version = "0.1.0"
edition = "2021"
description = "A Rust-based proof-of-existence notary system with blockchain anchoring"
authors = ["ProofChain Development Team"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/yourusername/proofchain"

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Merkle tree (we'll implement our own, but this can help)
# For now, we'll implement manually

# Blockchain interaction (optional for Phase 1, will add later)
# alloy = "0.1"  # Will add in Phase 3

[dev-dependencies]
tempfile = "3.9"
assert_cmd = "2.0"
predicates = "3.0"

[[bin]]
name = "proofchain"
path = "src/main.rs"
